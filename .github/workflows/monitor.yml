name: 채널 실시간 감시

on:
  schedule:
    - cron: "30 23,0-14 * * *" # 매시 30분, KST 08:30~23:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 감시 실행
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          YT_OAUTH_TOKENS: ${{ secrets.YT_OAUTH_TOKENS }}
        run: python3 monitor.py

      - name: 상태 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monitor_state.json
          git diff --cached --quiet && exit 0
          git commit -m "monitor: 상태 갱신"
          git pull --rebase
          git push

      - name: 실패 알림 (텔레그램)
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MSG="⚠️ ${{ github.workflow }} 실행 실패

          이 메시지를 클로드에게 그대로 보여주면 원인을 찾아 고쳐줍니다.
          기록: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT_ID}" \
            --data-urlencode text="$MSG"
